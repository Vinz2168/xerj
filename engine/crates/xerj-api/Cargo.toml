[package]
name = "xerj-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Built-in Candle neural embedder, for the `binary_bulk_throughput`
# example (#903) and for anyone linking this crate directly. The shipped
# binary turns it on through `xerj-server`'s own `neural` feature.
neural = ["xerj-engine/neural"]
# Local zero-shot decision head (issue #1057): tier 2 of the System One
# decide ladder, answering /v1/systemone and /_decide when the history
# index has no support. Mirrors how `neural` is gated — off by default,
# enabled by whoever links this crate (the xerj-server wiring is a
# follow-up).
decide-local = ["dep:xerj-ai", "xerj-ai/decide-local"]
onnx-experimental = ["xerj-engine/onnx-experimental"]

[dependencies]
xerj-common  = { path = "../xerj-common" }
xerj-engine  = { path = "../xerj-engine" }
xerj-query   = { path = "../xerj-query" }
xerj-rerank = { path = "../xerj-rerank" }
xerj-wasm    = { path = "../xerj-wasm" }
# Local decision head (feature `decide-local`); no other purpose, so the
# dependency itself is optional.
xerj-ai      = { path = "../xerj-ai", optional = true }
# Note: this crate intentionally does NOT depend on xerj-console-api.
# Xerj Console is a peer product mounted at the server level (`xerj-server`)
# via Router::merge. Engine API and Xerj Console API are decoupled — the
# engine doesn't know Xerj Console exists, and Xerj Console could be removed from
# the binary build without changing a line of xerj-api code.

tokio        = { workspace = true }
axum         = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
uuid         = { workspace = true }
chrono       = { workspace = true }
bytes        = { workspace = true }
prometheus   = { workspace = true }
dashmap              = { workspace = true }
tracing-subscriber   = { workspace = true }
# Second-brain graph API: edge_id identity hashing (SECOND_BRAIN_SPEC §2.3).
xxhash-rust          = { workspace = true }

async-trait  = "0.1"
libc         = "0.2"
# Share links (`/_share`): the passcode a guest types is short and human-typed,
# so unlike a minted API-key secret it needs a real password hash.
argon2       = "0.5"
# Share ids / passcodes are minted from the OS CSPRNG.
rand         = { workspace = true }
# Share ids are stored as a SHA-256 digest, never in the clear.
sha2         = "0.10"

[dev-dependencies]
tempfile     = { workspace = true }
tower        = { workspace = true, features = ["util"] }
http-body-util = "0.1"
